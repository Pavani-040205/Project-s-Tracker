{% extends "base.html" %}

{% block title %}Change Password – Project's Tracker{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h2>Change Password</h2>
        <p class="auth-subtitle">Logged in as <strong>{{ session['username'] }}</strong></p>

        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form action="/change_password" method="POST" class="auth-form">
            <div class="form-group">
                <label for="current_password">Current Password</label>
                <input
                    type="password"
                    id="current_password"
                    name="current_password"
                    placeholder="Enter your current password"
                    required
                    autocomplete="current-password"
                />
            </div>
            <div class="form-group">
                <label for="new_password">New Password</label>
                <input
                    type="password"
                    id="new_password"
                    name="new_password"
                    placeholder="Enter new password"
                    required
                    pattern="(?=.*[A-Za-z])(?=.*\d).+"
                    title="Password must contain both letters and numbers"
                    autocomplete="new-password"
                />
                <small class="field-hint">Must contain letters and numbers (e.g. pass123)</small>
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm New Password</label>
                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Repeat new password"
                    required
                    autocomplete="new-password"
                />
            </div>
            <button type="submit" class="btn btn-primary btn-full">Update Password</button>
        </form>

        <p class="auth-switch">
            <a href="/">← Back to Home</a>
        </p>
    </div>
</div>
{% endblock %}
